# Builds the web version of DentPass and publishes it on GitHub Pages
# every time code is pushed to main. Open it on any phone at:
# https://<your-username>.github.io/dentpass/
name: Build and publish web app

on:
  # Every branch is checked; only main is published.
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Supabase project URL and anon key are meant to be public:
  # the database rules decide what each user may see. Never put the service_role key here.
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ezfhozjfegtcyrwmvqpc.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'sb_publishable_ly8qNNEONqmFxlj_nkfcGg_xtpn5SJe' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Add the web platform files
        run: flutter create --platforms web --project-name dentpass --org com.dentpass .

      - name: Name the home-screen app
        run: |
          sed -i 's/"name": "dentpass"/"name": "DentPass"/; s/"short_name": "dentpass"/"short_name": "DentPass"/; s/"theme_color": "[^"]*"/"theme_color": "#0F5C52"/; s/"background_color": "[^"]*"/"background_color": "#F4F6F4"/' web/manifest.json
          sed -i 's/<title>dentpass<\/title>/<title>DentPass<\/title>/; s/content="dentpass"/content="DentPass"/' web/index.html

      - name: Get packages and translations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build
        run: |
          case "$SUPABASE_URL" in https://*) ;; *) echo "Set SUPABASE_URL to your Supabase project URL"; exit 1;; esac
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # Runs the real database rules on a private, throwaway Supabase and goes through
  # every step of the app: sign-up, documents, approval, posting, booking, passwords.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start a local Supabase with the app's database
        run: |
          [ -f supabase/config.toml ] || supabase init < /dev/null
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

      - name: Run the end-to-end checks
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY PUBLISHABLE_KEY SECRET_KEY
          cd tests/backend
          npm install --no-audit --no-fund
          npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check the notification sender compiles
        run: deno check supabase/functions/send-push/index.ts

  # Brings the live Supabase project up to date: database updates, the notification
  # sender and its keys. Needs the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets.
  supabase:
    needs: [build, backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ezfhozjfegtcyrwmvqpc
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Check the Supabase secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Link the live project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Record the updates that were run by hand (version 1 and 2)
        run: supabase migration repair --status applied 0001 0002 --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Apply new database updates
        run: supabase db push --include-all --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Create the phone notification keys (first time only)
        run: |
          if supabase secrets list --remote="$PROJECT_REF" | grep -q VAPID_PRIVATE_KEY; then
            echo "Keys already set"
          else
            keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            pub=$(node -e 'console.log(JSON.parse(process.argv[1]).publicKey)' "$keys")
            priv=$(node -e 'console.log(JSON.parse(process.argv[1]).privateKey)' "$keys")
            echo "::add-mask::$priv"
            supabase secrets set --remote="$PROJECT_REF" --yes VAPID_PUBLIC_KEY="$pub" VAPID_PRIVATE_KEY="$priv"
          fi

      - name: Install the notification sender
        run: supabase functions deploy send-push --remote="$PROJECT_REF" --no-verify-jwt --use-api --yes

  deploy:
    needs: [build, backend, supabase]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
